<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalStrike - Competitive Intelligence Reports</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 48px;
            margin-bottom: 16px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .header p {
            font-size: 20px;
            opacity: 0.9;
        }
        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }
        .client-card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .client-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .client-name {
            font-size: 24px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 8px;
        }
        .client-meta {
            color: #718096;
            font-size: 14px;
        }
        .arrow {
            color: #667eea;
            font-size: 20px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ SignalStrike</h1>
            <p>Competitive Intelligence Reports</p>
        </div>
        
        <div class="clients-grid">

            <a href="com-client-macrofactor/index.html" class="client-card">
                <div class="client-name">Com Client Macrofactor</div>
                <div class="client-meta">Latest: May 06, 2026</div>
                <div class="arrow">→</div>
            </a>

        </div>
    </div>
</body>
</html>
